<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Animação CSS</title>
   <!-- Biblioteca Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"&gt;
</head>

<body>

    <h1 id="titulo">Biblioteca Animate.CSS</h1>

    <img id="imagem" src="atividade27-10.jpg" alt="Paisagem natural">

    <p id="texto">Clique no botão para iniciar!</p>

    <button onclick="iniciar()">Iniciar animação</button>

    <script>
        function iniciar() {
            document.getElementById("texto").innerHTML = "A animação começará em 2 segundos!";

            setTimeout(function () {
                document.getElementById("imagem").classList.add("animate__animated", "animate__backInLeft");

                document.getElementById("texto").innerHTML = "Animação concluída!";
            }, 2000);
        }
    </script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #abb4f1;
            padding: 30px;
        }

        img {
            width: 500px;
            border-radius: 10px;
        }

        button {
            background: #022e24;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</body>

</html>
